name: claymores
description: Claymores RFC club app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  http: ^1.6.0
  material_ui: ^1.11.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  go_router: ^18.1.4
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^11.2.0
  app_links: ^7.2.2
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.8
  flutter_svg: ^2.5.0

dev_dependencies:
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/crest.png
    - assets/teams/
    - assets/club.groq
    - assets/club_snapshot.json
  fonts:
    - family: Claymore
      fonts:
        - asset: assets/Claymore.ttf
