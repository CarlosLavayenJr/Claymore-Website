# Builds the iPhone app in the cloud and uploads it to TestFlight, so no Mac
# has to sign in to an Apple account. Run it from the Actions tab (or the
# GitHub app): Actions -> iOS TestFlight -> Run workflow.
#
# Needs three repository secrets from an App Store Connect API key with the
# Admin role (App Store Connect -> Users and Access -> Integrations):
#   APP_STORE_CONNECT_KEY_ID     the key's ID
#   APP_STORE_CONNECT_ISSUER_ID  the issuer ID shown above the keys list
#   APP_STORE_CONNECT_KEY        the full text of the downloaded .p8 file
# Xcode uses the key to create the signing certificate and profile itself.
name: iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the App Store Connect secrets are set
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          missing=""
          [ -n "$KEY_ID" ] || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$KEY" ] || missing="$missing APP_STORE_CONNECT_KEY"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Tests
        run: flutter test

      - name: Build with the production settings
        # The GitHub run number is the build number, so every upload is new.
        run: >
          flutter build ios --release --no-codesign
          --dart-define-from-file=dart_defines/production.json
          --build-number=${{ github.run_number }}

      - name: Write the API key
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/keys/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey.p8"

      # Archive unsigned, then sign it ad hoc with the app's entitlements
      # (Sign in with Apple), so no Apple account or registered device is
      # needed here. Automatic signing would ask for a development profile at
      # this step, which needs a registered device; the team has none. The
      # export below re-signs everything for the App Store.
      - name: Archive
        run: >
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner
          -configuration Release -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive
          CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM=57539PPNC3

      - name: Sign the archive ad hoc with the entitlements
        run: |
          app="$RUNNER_TEMP/Runner.xcarchive/Products/Applications/Runner.app"
          for f in "$app"/Frameworks/*; do codesign --force --sign - "$f"; done
          codesign --force --sign - --entitlements ios/Runner/Runner.entitlements "$app"
          codesign --verify --deep --strict "$app"

      # Export signs for the App Store with automatic, cloud-managed signing:
      # Xcode creates the distribution certificate and App Store profile with
      # the API key. App Store profiles need no devices.
      - name: Sign for the App Store
        run: >
          xcodebuild -exportArchive
          -archivePath "$RUNNER_TEMP/Runner.xcarchive"
          -exportOptionsPlist ios/ExportOptions-check.plist
          -exportPath "$RUNNER_TEMP/export"
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8"
          -authenticationKeyID "$KEY_ID"
          -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Check the signed app before uploading
        run: |
          cd "$RUNNER_TEMP/export"
          unzip -q -o *.ipa -d ipa
          app=$(ls -d ipa/Payload/*.app)
          codesign -d --entitlements - --xml "$app" > entitlements.plist 2>/dev/null
          codesign -dvv "$app" 2>&1 | grep -E "Authority|TeamIdentifier"
          grep -q "com.apple.developer.applesignin" entitlements.plist \
            || { echo "::error::Sign in with Apple entitlement missing from the signed app"; exit 1; }
          grep -A1 "aps-environment" entitlements.plist | grep -q "production" \
            || { echo "::error::Push (aps-environment production) missing from the signed app"; exit 1; }
          grep -q "Apple Distribution" <(codesign -dvv "$app" 2>&1) \
            || { echo "::error::Not signed with an Apple Distribution certificate"; exit 1; }
          echo "Signed for distribution with Sign in with Apple and push."

      - name: Upload to TestFlight
        run: >
          xcodebuild -exportArchive
          -archivePath "$RUNNER_TEMP/Runner.xcarchive"
          -exportOptionsPlist ios/ExportOptions.plist
          -exportPath "$RUNNER_TEMP/upload"
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8"
          -authenticationKeyID "$KEY_ID"
          -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
