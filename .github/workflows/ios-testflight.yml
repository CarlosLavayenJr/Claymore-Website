# Builds the iPhone app in the cloud and uploads it to TestFlight, so no Mac
# has to sign in to an Apple account. Run it from the Actions tab (or the
# GitHub app): Actions -> iOS TestFlight -> Run workflow.
#
# Needs three repository secrets from an App Store Connect API key with the
# Admin role (App Store Connect -> Users and Access -> Integrations):
#   APP_STORE_CONNECT_KEY_ID     the key's ID
#   APP_STORE_CONNECT_ISSUER_ID  the issuer ID shown above the keys list
#   APP_STORE_CONNECT_KEY        the full text of the downloaded .p8 file
# Xcode uses the key to create the signing certificate and profile itself.
name: iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the App Store Connect secrets are set
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          missing=""
          [ -n "$KEY_ID" ] || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$KEY" ] || missing="$missing APP_STORE_CONNECT_KEY"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Tests
        run: flutter test

      - name: Build with the production settings
        # The GitHub run number is the build number, so every upload is new.
        run: >
          flutter build ios --release --no-codesign
          --dart-define-from-file=dart_defines/production.json
          --build-number=${{ github.run_number }}

      - name: Write the API key
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/keys/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey.p8"

      # Signs for distribution (an App Store profile), not development: a
      # development profile needs registered devices, and the team has none.
      - name: Archive (signs with the API key)
        run: >
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner
          -configuration Release -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8"
          -authenticationKeyID "$KEY_ID"
          -authenticationKeyIssuerID "$ISSUER_ID"
          CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM=57539PPNC3
          CODE_SIGN_IDENTITY="Apple Distribution"

      - name: Upload to TestFlight
        run: >
          xcodebuild -exportArchive
          -archivePath "$RUNNER_TEMP/Runner.xcarchive"
          -exportOptionsPlist ios/ExportOptions.plist
          -exportPath "$RUNNER_TEMP/export"
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8"
          -authenticationKeyID "$KEY_ID"
          -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
