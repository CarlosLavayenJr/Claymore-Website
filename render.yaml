# Render Blueprint for the Claymores API and its Postgres database.
# The website is deployed by Vercel, not Render. Secrets marked sync: false are
# entered in the Render dashboard when the Blueprint is first applied.
services:
  - type: web
    name: claymores-api
    runtime: docker
    region: virginia
    plan: starter
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /health/ready
    buildFilter:
      paths:
        - api/**
        - render.yaml
      ignoredPaths:
        - api/**/*.md
        - api/tests/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: claymores-db
          property: connectionString
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Cors__PublicOrigins__0
        value: https://www.claymoresrfc.com
      # Google sign-in. Leave both blank to run with public data only.
      - key: Authentication__Google__ClientId
        sync: false
      - key: Authentication__Google__ClientSecret
        sync: false
      # Bootstrap admin. Invite everyone else from the API afterwards.
      - key: Authentication__Google__AdminEmails__0
        sync: false
      # Mobile sign-in (Flutter). Off until the app's OAuth clients are set up.
      # The signing key for API access tokens is generated by Render.
      - key: MobileAuth__Enabled
        value: "false"
      - key: Authentication__Tokens__SigningKey
        generateValue: true
      - key: Authentication__Google__MobileClientIds__0
        sync: false
      # Sign in with Apple (iOS app): the bundle ID is the identity token's audience.
      - key: Authentication__Apple__ClientIds__0
        value: com.claymoresrfc.claymores

  # rugbyfl.com scraper, shadow mode: writes Postgres only; public endpoints keep serving
  # Sanity-imported fixtures until Fixtures__Source=scraper is set on the web service.
  # Same image as the API, run as a one-off command. Schedules are UTC and match vercel.json.
  - type: cron
    name: claymores-scrape-fixtures
    runtime: docker
    region: virginia
    plan: starter
    schedule: "0 3 * * 1"
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    dockerCommand: dotnet Claymores.Api.dll --scrape-fixtures
    buildFilter:
      paths:
        - api/**
        - render.yaml
      ignoredPaths:
        - api/**/*.md
        - api/tests/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: claymores-db
          property: connectionString
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
  - type: cron
    name: claymores-scrape-standings
    runtime: docker
    region: virginia
    plan: starter
    schedule: "0 11 * * 1"
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    dockerCommand: dotnet Claymores.Api.dll --scrape-standings
    buildFilter:
      paths:
        - api/**
        - render.yaml
      ignoredPaths:
        - api/**/*.md
        - api/tests/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: claymores-db
          property: connectionString
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

databases:
  - name: claymores-db
    databaseName: claymores
    region: virginia
    plan: basic-256mb
    ipAllowList: []
