# Render Blueprint for the Claymores API and its Postgres database.
# The website is deployed by Vercel, not Render. Secrets marked sync: false are
# entered in the Render dashboard when the Blueprint is first applied.
services:
  - type: web
    name: claymores-api
    runtime: docker
    region: virginia
    plan: starter
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /health/ready
    buildFilter:
      paths:
        - api/**
        - render.yaml
      ignoredPaths:
        - api/**/*.md
        - api/tests/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: claymores-db
          property: connectionString
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Swagger__Enabled
        value: "true"
      - key: Cors__PublicOrigins__0
        value: https://www.claymoresrfc.com
      # Serve scraped Postgres data (see api/README.md, Cutover). Standings seasons not yet in
      # Postgres fall back to Sanity per request. Teams, players and practices still read Sanity.
      - key: Fixtures__Source
        value: scraper
      - key: Standings__Source
        value: postgres
      # Google sign-in: the "Claymores web (API + website)" client in Google Cloud project
      # claymores-rfc. The ID is public; the secret is set in the Render dashboard only.
      - key: Authentication__Google__ClientId
        value: 1070515951514-45g3t5rftj9cv97lg4e9qk9jjf9b69oo.apps.googleusercontent.com
      - key: Authentication__Google__ClientSecret
        sync: false
      # Bootstrap admin. Invite everyone else from the API afterwards.
      - key: Authentication__Google__AdminEmails__0
        sync: false
      # Mobile and website sign-in (token exchange). The signing key for API access
      # tokens is generated by Render.
      - key: MobileAuth__Enabled
        value: "true"
      - key: Authentication__Tokens__SigningKey
        generateValue: true
      # "Claymores iOS app" client (bundle ID com.claymoresrfc.claymores).
      - key: Authentication__Google__MobileClientIds__0
        value: 1070515951514-ukk1opg2c2ajdln89mb424n8b9cuir2k.apps.googleusercontent.com
      # Sign in with Apple (iOS app): the bundle ID is the identity token's audience.
      - key: Authentication__Apple__ClientIds__0
        value: com.claymoresrfc.claymores
      # Apple token revocation on account deletion (see api/README.md, Delete my account).
      # Team ID is public. Add the Sign in with Apple key's ID here as Authentication__Apple__KeyId
      # once the key exists; until then revocation is skipped and logged.
      - key: Authentication__Apple__TeamId
        value: 57539PPNC3
      # The .p8 key contents (PEM). Secret: set in the Render dashboard only.
      - key: Authentication__Apple__PrivateKey
        sync: false
      # Dues and Stripe Checkout, in TEST mode (Stripe__Mode defaults to test; going live
      # follows the checklist in api/README.md). The sk_test_ key and the webhook's whsec_
      # secret are set in the Render dashboard only.
      - key: Dues__Enabled
        value: "true"
      - key: Stripe__CheckoutEnabled
        value: "true"
      - key: Stripe__SecretKey
        sync: false
      # Firebase service account JSON for push (lineup alerts); the reminder cron has its own copy.
      - key: Push__FirebaseServiceAccount
        sync: false
      - key: Stripe__WebhookSecret
        sync: false
      - key: Stripe__ReturnOrigin
        value: https://claymores-api-4zm4.onrender.com
      # Where Stripe sends the app back (deep link, see mobile/lib/app/deep_links.dart).
      - key: Stripe__AppReturnUrl
        value: claymores://dues
      # Where Stripe returns website checkouts (returnTo "web").
      - key: Stripe__WebReturnUrl
        value: https://www.claymoresrfc.com/account

  # rugbyfl.com scraper: writes Postgres only. The web service serves these rows
  # (Fixtures__Source=scraper, Standings__Source=postgres above).
  # Same image as the API, run as a one-off command. Schedules are UTC and match vercel.json.
  - type: cron
    name: claymores-scrape-fixtures
    runtime: docker
    region: virginia
    plan: starter
    schedule: "0 3 * * 1"
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    dockerCommand: dotnet Claymores.Api.dll --scrape-fixtures
    buildFilter:
      paths:
        - api/**
        - render.yaml
      ignoredPaths:
        - api/**/*.md
        - api/tests/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: claymores-db
          property: connectionString
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
  - type: cron
    name: claymores-scrape-standings
    runtime: docker
    region: virginia
    plan: starter
    schedule: "0 11 * * 1"
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    dockerCommand: dotnet Claymores.Api.dll --scrape-standings
    buildFilter:
      paths:
        - api/**
        - render.yaml
      ignoredPaths:
        - api/**/*.md
        - api/tests/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: claymores-db
          property: connectionString
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
  # Copies CMS fixes to the API every hour: matches with "Manual Override" or "Hide this match"
  # checked in Sanity Studio (see SanityAdoption). Reads Sanity, writes Postgres; rerunning is a no-op.
  - type: cron
    name: claymores-sync-cms
    runtime: docker
    region: virginia
    plan: starter
    schedule: "15 * * * *"
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    dockerCommand: dotnet Claymores.Api.dll --adopt-sanity-overrides
    buildFilter:
      paths:
        - api/**
        - render.yaml
      ignoredPaths:
        - api/**/*.md
        - api/tests/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: claymores-db
          property: connectionString
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

  # Match reminders (push), hourly: 21, 14, 7, 5 and 2 days out, the day before and match day,
  # each sent once after 10 AM Orlando time (see MatchReminders). Needs Push__FirebaseServiceAccount.
  - type: cron
    name: claymores-send-reminders
    runtime: docker
    region: virginia
    plan: starter
    schedule: "30 * * * *"
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    dockerCommand: dotnet Claymores.Api.dll --send-reminders
    buildFilter:
      paths:
        - api/**
        - render.yaml
      ignoredPaths:
        - api/**/*.md
        - api/tests/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: claymores-db
          property: connectionString
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Fixtures__Source
        value: scraper
      - key: Push__FirebaseServiceAccount
        sync: false

databases:
  - name: claymores-db
    databaseName: claymores
    region: virginia
    plan: basic-256mb
    ipAllowList: []
